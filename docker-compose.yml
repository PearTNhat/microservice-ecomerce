services:
  # 1. PostgreSQL - Database chính
  postgres:
    image: postgres:15-alpine
    container_name: ecom-postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: ecomerce
    ports:
      - "5428:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Redis - Cache / Session / Task Queue (Asynq)
  redis:
    image: redis:7-alpine
    container_name: ecom-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Giao diện quản lý Redis (RedisInsight)
  redisinsight:
    image: redis/redisinsight:latest
    container_name: ecom-redisinsight
    restart: always
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data

