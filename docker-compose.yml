  #     - es_data:/usr/share/elasticsearch/data
  # 3. MongoDB - Cơ sở dữ liệu cấu hình cho Graylog
  mongo:
    image: mongo:6.0
    container_name: ecom-mongo
    restart: always
    volumes:
      - mongo_data:/data/db

  # 4. OpenSearch - Lưu trữ và lập chỉ mục Log cho Graylog
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: ecom-opensearch
    restart: always
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "bootstrap.memory_lock=true"
      - "discovery.type=single-node"
      - "action.auto_create_index=false"
      - "plugins.security.disabled=true"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=SecretPassword123!"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  # 5. Graylog - Máy chủ Quản lý Log tập trung & Giao diện Web
  graylog:
    image: graylog/graylog:6.0
    container_name: ecom-graylog
    restart: always
    depends_on:
      - mongo
      - opensearch
    environment:
      GRAYLOG_PASSWORD_SECRET: "somepasswordsecretmustbeatleast16characterslong"
      # Mật khẩu root: admin12345 (SHA256)
      GRAYLOG_ROOT_PASSWORD_SHA2: "d829141973cf6ff236e71ef3b58498fe641321d255d64ff1b4e06263595cf0d0"
      GRAYLOG_HTTP_BIND_ADDRESS: "0.0.0.0:9000"
      GRAYLOG_ROOT_TIMEZONE: "Asia/Ho_Chi_Minh"
    ports:
      - "9000:9000"    # Graylog Web Interface & REST API
      - "12201:12201/udp" # GELF UDP Port nhận log từ Go Services
      - "12201:12201/tcp" # GELF TCP Port
    volumes:
      - graylog_data:/usr/share/graylog/data/data

volumes:
  postgres_data:
  redis_data:
  redisinsight_data:
  mongo_data:
  opensearch_data:
  graylog_data:
