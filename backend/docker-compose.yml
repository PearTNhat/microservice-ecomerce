services:
  # 1. PostgreSQL - Database Server chứa 3 database riêng biệt (ecom_user_db, ecom_product_db, ecom_order_db)
  postgres:
    image: postgres:15-alpine
    container_name: ecom-postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: ecomerce
    ports:
      - "5428:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh

  # 2. Redis - Cache / Session / Task Queue (Asynq)
  redis:
    image: redis:7-alpine
    container_name: ecom-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Giao diện quản lý Redis (RedisInsight)
  redisinsight:
    image: redis/redisinsight:latest
    container_name: ecom-redisinsight
    restart: always
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data

  # 3. Apache Kafka - Event Streaming (KRaft mode siêu nhẹ, không cần Zookeeper)
  kafka:
    image: apache/kafka:3.7.0
    container_name: ecom-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:29092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
    volumes:
      - kafka_data:/var/lib/kafka/data

  # 4. Elasticsearch 8 - Tìm kiếm sản phẩm siêu tốc (Full-Text Search)
  elasticsearch:
    image: elasticsearch:8.10.2
    container_name: ecom-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # Tắt SSL nội bộ để tiện dev local
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # 5. MongoDB - Cơ sở dữ liệu cấu hình cho Graylog
  mongo:
    image: mongo:6.0
    container_name: ecom-mongo
    restart: always
    volumes:
      - mongo_data:/data/db

  # 6. OpenSearch - Lưu trữ và lập chỉ mục Log cho Graylog
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: ecom-opensearch
    restart: always
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "bootstrap.memory_lock=true"
      - "discovery.type=single-node"
      - "action.auto_create_index=false"
      - "plugins.security.disabled=true"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=SecretPassword123!"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9201:9200" # Đổi cổng ngoài sang 9201 để nhường 9200 cho Elasticsearch
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  # 7. Graylog - Máy chủ Quản lý Log tập trung & Giao diện Web
  graylog:
    image: graylog/graylog:6.0
    container_name: ecom-graylog
    restart: always
    depends_on:
      - mongo
      - opensearch
    environment:
      GRAYLOG_PASSWORD_SECRET: "somepasswordsecretmustbeatleast16characterslong"
      GRAYLOG_ROOT_PASSWORD_SHA2: "d829141973cf6ff236e71ef3b58498fe641321d255d64ff1b4e06263595cf0d0"
      GRAYLOG_HTTP_BIND_ADDRESS: "0.0.0.0:9000"
      GRAYLOG_ROOT_TIMEZONE: "Asia/Ho_Chi_Minh"
    ports:
      - "9000:9000"    # Graylog Web Interface & REST API
      - "12201:12201/udp" # GELF UDP Port nhận log từ Go Services
      - "12201:12201/tcp" # GELF TCP Port
    volumes:
      - graylog_data:/usr/share/graylog/data/data

volumes:
  postgres_data:
  redis_data:
  redisinsight_data:
  kafka_data:
  es_data:
  mongo_data:
  opensearch_data:
  graylog_data:
